# NOTE: As of time of writing, reusable workflows cannot use Trusted Publishing.
#       See https://github.com/pypa/gh-action-pypi-publish .
#       This is why this publishing workflow is repeated in each repository.

on:
  push:
    tags:
      - 'v*'
      - '!v*rc*'

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          pip install --upgrade pip hatch

      - name: Install dependencies
        run: |
          pip install .[dev]

      - name: Build package
        run: |
          hatch build --clean

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
